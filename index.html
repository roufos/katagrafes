<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<title>Καταχωρήσεις</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6f8;
 color:#202124
}
header{
 background:#1976d2;
 color:white;
 padding:18px 16px;
 font-size:22px;
 font-weight:bold
}
main{
 padding:16px;
 max-width:650px;
 margin:auto
}
.card{
 background:white;
 border-radius:14px;
 padding:16px;
 margin-bottom:16px;
 box-shadow:0 2px 8px #00000012
}
label{
 display:block;
 font-weight:bold;
 margin:12px 0 6px
}
input,select,button{
 width:100%;
 font-size:17px;
 padding:12px;
 border-radius:10px;
 border:1px solid #ccd2d8
}
button{
 background:#1976d2;
 color:white;
 border:0;
 font-weight:bold;
 margin-top:16px
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #eee
}
.row:last-child{border-bottom:0}
.price{font-weight:bold}
.delete{
 width:auto;
 margin:5px 0 0;
 padding:7px 10px;
 background:#e53935;
 font-size:14px
}
.empty{
 color:#666;
 text-align:center;
 padding:20px
}
.total{
 font-size:19px;
 font-weight:bold;
 text-align:right;
 margin-top:12px
}
</style>
</head>

<body>

<header>Καταχωρήσεις</header>

<main>

<section class="card">

<h2>Νέα καταχώρηση</h2>

<label>Ημερομηνία</label>
<input id="date" type="date">

<label>Κατηγορία</label>
<select id="category">
<option>1 — Διατροφή και μη αλκοολούχα ποτά</option>
<option>2 — Αλκοολούχα ποτά και καπνός</option>
<option>3 — Ένδυση και υπόδηση</option>
<option>4 — Στέγαση</option>
<option>5 — Διαρκή αγαθά, είδη νοικοκυριού και υπηρεσίες</option>
<option>6 — Υγεία</option>
<option>7 — Μεταφορές</option>
<option>8 — Επικοινωνίες</option>
<option>9 — Αναψυχή και πολιτισμός</option>
<option>10 — Εκπαίδευση</option>
<option>11 — Ξενοδοχεία, καφέ, εστιατόρια</option>
<option>12 — Διάφορα αγαθά και υπηρεσίες</option>
</select>

<label>Τιμή (€)</label>
<input id="price"
       type="number"
       min="0"
       step="0.01"
       inputmode="decimal"
       placeholder="π.χ. 2,50">

<button onclick="addEntry()">Αποθήκευση</button>

</section>

<section class="card">

<h2>Καταχωρήσεις</h2>

<div id="list"></div>

<div id="total" class="total"></div>

 <button onclick="exportCSV()">
  Εξαγωγή CSV
</button>

</section>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBb4DPdxCDxhvKN2RrdFcguICttyJ1Kusw",
  authDomain: "expenses-app-d3ecd.firebaseapp.com",
  projectId: "expenses-app-d3ecd",
  storageBucket: "expenses-app-d3ecd.firebasestorage.app",
  messagingSenderId: "522397626820",
  appId: "1:522397626820:web:51c4cdc0900a907b507491"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Πεδίο ημερομηνίας
const dateEl = document.getElementById("date");

// Βάζει αυτόματα τη σημερινή ημερομηνία
const now = new Date();
dateEl.value = new Date(
  now.getTime() - now.getTimezoneOffset() * 60000
).toISOString().slice(0, 10);
 

// Εδώ κρατάμε προσωρινά τις καταχωρήσεις που έρχονται από Firebase
let entries = [];

// Φόρτωση καταχωρήσεων από Firebase
async function load() {

  const snapshot = await getDocs(collection(db, "expenses"));

  entries = snapshot.docs.map(document => ({
    firebaseId: document.id,
    ...document.data()
  }));

  // Ταξινόμηση: οι νεότερες πρώτες
  entries.sort((a, b) => {
    const aTime = a.createdAt || 0;
    const bTime = b.createdAt || 0;
    return bTime - aTime;
  });

  render();
}

// Προσθήκη νέας καταχώρησης
window.addEntry = async function addEntry() {

  const price = parseFloat(
    document.getElementById("price").value.replace(",", ".")
  );

  if (!Number.isFinite(price) || price < 0) {
    alert("Βάλε έγκυρη τιμή.");
    return;
  }

  const newEntry = {
    date: dateEl.value,
    category: document.getElementById("category").value,
    price: Math.round(price * 100) / 100,
    createdAt: Date.now()
  };

  await addDoc(collection(db, "expenses"), newEntry);

  document.getElementById("price").value = "";

  await load();
};

// Διαγραφή καταχώρησης
window.removeEntry = async function removeEntry(firebaseId) {

  await deleteDoc(doc(db, "expenses", firebaseId));

  await load();
};

// Μορφοποίηση ημερομηνίας από 2026-08-15 σε 15/08/2026
function fmtDate(s) {

  if (!s) return "";

  const [y, m, d] = s.split("-");

  return `${d}/${m}/${y}`;
}

// Εμφάνιση καταχωρήσεων στην οθόνη
function render() {

  const list = document.getElementById("list");

  if (!entries.length) {

    list.innerHTML =
      '<div class="empty">Δεν υπάρχουν καταχωρήσεις.</div>';

    document.getElementById("total").textContent = "";

    return;
  }

  list.innerHTML = entries.map(x => `

    <div class="row">

      <div>
        <b>${fmtDate(x.date)}</b><br>
        ${x.category}
      </div>

      <div style="text-align:right">

        <span class="price">
          ${Number(x.price).toFixed(2).replace(".", ",")} €
        </span>

        <br>

        <button
          class="delete"
          onclick="removeEntry('${x.firebaseId}')">
          Διαγραφή
        </button>

      </div>

    </div>

  `).join("");

  const total = entries.reduce(
    (sum, x) => sum + Number(x.price || 0), 0
  );

  document.getElementById("total").textContent =
    `Σύνολο: ${total.toFixed(2).replace(".", ",")} €`;
}

 window.exportCSV = function exportCSV() {

    if (!entries.length) {
    alert("Δεν υπάρχουν καταχωρήσεις.");
    return;
  }

  const rows = [
    ["Ημερομηνία", "Κατηγορία", "Ποσό"]
  ];

  entries.forEach(entry => {
    rows.push([
      entry.date,
      entry.category,
      entry.price
    ]);
  });

    const csvContent = rows
    .map(row => row.join(";"))
    .join("\n");

};

// Αρχική φόρτωση καταχωρήσεων
load();

</script>

</body>
</html>
