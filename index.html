<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<title>Καταχωρήσεις</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">  
</script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6f8;
 color:#202124
}
header{
 background:#1976d2;
 color:white;
 padding:18px 16px;
 font-size:22px;
 font-weight:bold
}
main{
 padding:16px;
 max-width:650px;
 margin:auto
}
.card{
 background:white;
 border-radius:14px;
 padding:16px;
 margin-bottom:16px;
 box-shadow:0 2px 8px #00000012
}
label{
 display:block;
 font-weight:bold;
 margin:12px 0 6px
}
input,select,button{
 width:100%;
 font-size:17px;
 padding:12px;
 border-radius:10px;
 border:1px solid #ccd2d8
}
button{
 background:#1976d2;
 color:white;
 border:0;
 font-weight:bold;
 margin-top:16px
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #eee
}
.row:last-child{border-bottom:0}
.price{font-weight:bold}
.delete{
 width:auto;
 margin:5px 0 0;
 padding:7px 10px;
 background:#e53935;
 font-size:14px
}
.empty{
 color:#666;
 text-align:center;
 padding:20px
}
.total{
 font-size:19px;
 font-weight:bold;
 text-align:right;
 margin-top:12px
}
</style>
</head>

<body>

<header>Καταχωρήσεις</header>

<main>

<section class="card">

<h2>Νέα καταχώρηση</h2>

<label>Ημερομηνία</label>
<input id="date" type="date">

<label>Κατηγορία</label>
<select id="category">
<option>1 — Διατροφή και μη αλκοολούχα ποτά</option>
<option>2 — Αλκοολούχα ποτά και καπνός</option>
<option>3 — Ένδυση και υπόδηση</option>
<option>4 — Στέγαση</option>
<option>5 — Διαρκή αγαθά, είδη νοικοκυριού και υπηρεσίες</option>
<option>6 — Υγεία</option>
<option>7 — Μεταφορές</option>
<option>8 — Επικοινωνίες</option>
<option>9 — Αναψυχή και πολιτισμός</option>
<option>10 — Εκπαίδευση</option>
<option>11 — Ξενοδοχεία, καφέ, εστιατόρια</option>
<option>12 — Διάφορα αγαθά και υπηρεσίες</option>
</select>

 <label>Υποκατηγορία</label>
<select id="subcategory">
<option>Άλλο</option>
</select>

<label>Τιμή (€)</label>
<input id="price"
       type="text"
       inputmode="decimal"
       placeholder="π.χ. 2,50">

<button onclick="addEntry()">Αποθήκευση</button>

</section>

<section class="card">

<h2>Καταχωρήσεις</h2>

<div id="list"></div>

<div id="total" class="total"></div>

 <button onclick="exportCSV()">
  Εξαγωγή CSV
</button>

</section>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBb4DPdxCDxhvKN2RrdFcguICttyJ1Kusw",
  authDomain: "expenses-app-d3ecd.firebaseapp.com",
  projectId: "expenses-app-d3ecd",
  storageBucket: "expenses-app-d3ecd.firebasestorage.app",
  messagingSenderId: "522397626820",
  appId: "1:522397626820:web:51c4cdc0900a907b507491"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Πεδίο ημερομηνίας
const dateEl = document.getElementById("date");
const categoryEl = document.getElementById("category");
const subcategoryEl = document.getElementById("subcategory");

// Βάζει αυτόματα τη σημερινή ημερομηνία
const now = new Date();
dateEl.value = new Date(
  now.getTime() - now.getTimezoneOffset() * 60000
).toISOString().slice(0, 10);
 

// Εδώ κρατάμε προσωρινά τις καταχωρήσεις που έρχονται από Firebase
let entries = [];

 // Αν έχει τιμή, σημαίνει ότι επεξεργαζόμαστε υπάρχουσα εγγραφή
let editingId = null;
 // Υποκατηγορίες ανά βασική κατηγορία
const subcategoriesByCategory = {
  "1": [
    "Σούπερ μάρκετ",
    "Φούρνος",
    "Mini market",
    "Κρεοπωλείο/Μανάβικο",
    "Νερά/αναψυκτικά",
    "Άλλο"
  ],
  "2": [
    "Καπνός",
    "Αλκοόλ",
    "Άλλο"
  ],
  "3": [
    "Ρούχα",
    "Παπούτσια",
    "Παιδικά",
    "Άλλο"
  ],
  "4": [
    "Ενοίκιο",
    "Ρεύμα",
    "Νερό",
    "Κοινόχρηστα",
    "Θέρμανση",
    "Συντήρηση σπιτιού",
    "Άλλο"
  ],
  "5": [
    "Ηλεκτρικές συσκευές",
    "Έπιπλα",
    "Είδη σπιτιού",
    "Καθαριστικά",
    "Εργαλεία/επισκευές",
    "Άλλο"
  ],
  "6": [
    "Φάρμακα",
    "Γιατρός",
    "Εξετάσεις",
    "Οδοντίατρος",
    "Άλλο"
  ],
  "7": [
    "Καύσιμα",
    "Διόδια",
    "Parking",
    "Service",
    "Ασφάλεια/τέλη",
    "ΜΜΜ/Ταξί",
    "Άλλο"
  ],
  "8": [
    "Κινητό",
    "Internet",
    "Συνδρομές επικοινωνίας",
    "Άλλο"
  ],
  "9": [
    "Παιχνίδια",
    "Σινεμά/θέατρο",
    "Βιβλία",
    "Δραστηριότητες παιδιών",
    "Streaming/συνδρομές",
    "Άλλο"
  ],
  "10": [
    "Σχολείο",
    "Φροντιστήριο",
    "Βιβλία/γραφική ύλη",
    "Δραστηριότητες εκπαίδευσης",
    "Άλλο"
  ],
  "11": [
    "Καφές",
    "Φαγητό έξω",
    "Delivery",
    "Ξενοδοχείο/Διαμονή",
    "Παγωτό/σνακ έξω",
    "Άλλο"
  ],
  "12": [
    "Κούρεμα/περιποίηση",
    "Δώρα",
    "Δημόσιες υπηρεσίες/έγγραφα",
    "Τράπεζες/χρεώσεις",
    "Άλλο"
  ]
};

 // Παίρνει τον αριθμό κατηγορίας από το κείμενο, π.χ. "11 — ..." -> "11"
function getCategoryId(categoryText) {
  return String(categoryText).split("—")[0].trim();
}

// Γεμίζει το dropdown υποκατηγορίας ανάλογα με την κατηγορία
function updateSubcategoryOptions() {

  const categoryId = getCategoryId(categoryEl.value);

  const subcategories = subcategoriesByCategory[categoryId] || ["Άλλο"];

  subcategoryEl.innerHTML = subcategories
    .map(name => `<option>${name}</option>`)
    .join("");
}

// Φόρτωση καταχωρήσεων από Firebase
async function load() {

  const snapshot = await getDocs(collection(db, "expenses"));

  entries = snapshot.docs.map(document => ({
    firebaseId: document.id,
    ...document.data()
  }));

  // Ταξινόμηση: οι νεότερες πρώτες
  entries.sort((a, b) => {
    const aTime = a.createdAt || 0;
    const bTime = b.createdAt || 0;
    return bTime - aTime;
  });

  render();
}

// Προσθήκη ή ενημέρωση καταχώρησης
window.addEntry = async function addEntry() {

  const price = parsePriceValue(
  document.getElementById("price").value
);

  if (!Number.isFinite(price) || price < 0) {
    alert("Βάλε έγκυρη τιμή.");
    return;
  }

  const entryData = {
  date: dateEl.value,
  categoryId: getCategoryId(categoryEl.value),
  category: categoryEl.value,
  subcategory: subcategoryEl.value,
  price: Math.round(price * 100) / 100
};

  if (editingId) {

    await updateDoc(doc(db, "expenses", editingId), entryData);

    editingId = null;

    document.querySelector("button[onclick='addEntry()']").textContent =
      "Αποθήκευση";

  } else {

    await addDoc(collection(db, "expenses"), {
      ...entryData,
      createdAt: Date.now()
    });
  }

  document.getElementById("price").value = "";

  await load();
};

// Διαγραφή καταχώρησης
window.removeEntry = async function removeEntry(firebaseId) {

  if (!confirm("Να διαγραφεί η εγγραφή;")) return;

  await deleteDoc(doc(db, "expenses", firebaseId));

  await load();
};

// Φόρτωση εγγραφής στη φόρμα για επεξεργασία
window.editEntry = function editEntry(firebaseId) {

  const entry = entries.find(x => x.firebaseId === firebaseId);

  if (!entry) {
    alert("Δεν βρέθηκε η εγγραφή.");
    return;
  }

  editingId = firebaseId;

dateEl.value = entry.date;
categoryEl.value = entry.category;

updateSubcategoryOptions();

subcategoryEl.value = entry.subcategory || "Άλλο";

document.getElementById("price").value = fmtPrice(entry.price);

  document.querySelector("button[onclick='addEntry()']").textContent =
    "Ενημέρωση";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
};

// Διαβάζει ποσό είτε με κόμμα είτε με τελεία
function parsePriceValue(value) {

  if (!value) return NaN;

  let cleaned = String(value).trim();

  // Αν ο χρήστης βάλει κόμμα, το κάνουμε τελεία για να αποθηκευτεί ως αριθμός.
  cleaned = cleaned.replace(",", ".");

  // Επιτρέπουμε μόνο αριθμούς με προαιρετικά δεκαδικά
  if (!/^\d+(\.\d+)?$/.test(cleaned)) {
    return NaN;
  }

  return Number(cleaned);
}

// Εμφανίζει ποσό με ελληνικό κόμμα, χωρίς διαχωριστικό χιλιάδων
function fmtPrice(value) {

  return Number(value || 0)
    .toFixed(2)
    .replace(".", ",");
}

 // Επιστρέφει το όνομα μήνα στα ελληνικά από ημερομηνία τύπου 2026-08-16
function getMonthName(dateText) {

  if (!dateText) return "";

  const monthNumber = Number(dateText.slice(5, 7));

  const months = [
    "",
    "Ιανουάριος",
    "Φεβρουάριος",
    "Μάρτιος",
    "Απρίλιος",
    "Μάιος",
    "Ιούνιος",
    "Ιούλιος",
    "Αύγουστος",
    "Σεπτέμβριος",
    "Οκτώβριος",
    "Νοέμβριος",
    "Δεκέμβριος"
  ];

  return months[monthNumber] || "";
}
 
// Μορφοποίηση ημερομηνίας από 2026-08-15 σε 15/08/2026
function fmtDate(s) {

  if (!s) return "";

  const [y, m, d] = s.split("-");

  return `${d}/${m}/${y}`;
}

// Εμφάνιση καταχωρήσεων στην οθόνη
function render() {

  const list = document.getElementById("list");

  if (!entries.length) {

    list.innerHTML =
      '<div class="empty">Δεν υπάρχουν καταχωρήσεις.</div>';

    document.getElementById("total").textContent = "";

    return;
  }

  list.innerHTML = entries.map(x => `

    <div class="row">

      <div>
  <b>${fmtDate(x.date)}</b><br>
  ${x.category}<br>
  <small>${x.subcategory || "-"}</small>
</div>

      <div style="text-align:right">

        <span class="price">
          ${fmtPrice(x.price)} €
        </span>

        <br>

                <button
          class="delete"
          style="background:#f9a825"
          onclick="editEntry('${x.firebaseId}')">
          Επεξεργασία
        </button>

        <button
          class="delete"
          onclick="removeEntry('${x.firebaseId}')">
          Διαγραφή
        </button>

      </div>

    </div>

  `).join("");

  const total = entries.reduce(
    (sum, x) => sum + Number(x.price || 0), 0
  );

  document.getElementById("total").textContent =
  `Σύνολο: ${fmtPrice(total)} €`;
}

window.exportCSV = function exportCSV() {

  if (!entries.length) {
    alert("Δεν υπάρχουν καταχωρήσεις.");
    return;
  }

  const rows = [
    [
      "Ημερομηνία",
      "Έτος",
      "Μήνας",
      "Αρ. Κατηγορίας",
      "Κατηγορία",
      "Υποκατηγορία",
      "Ποσό"
    ]
  ];

  entries.forEach(entry => {

    const dateText = entry.date || "";
    const year = dateText.slice(0, 4);
    const monthName = getMonthName(dateText);

    const categoryText = entry.category || "";
    const categoryId = entry.categoryId || getCategoryId(categoryText);

    const subcategory = entry.subcategory || "-";

    const formattedPrice = fmtPrice(entry.price);

    rows.push([
      fmtDate(dateText),
      year,
      monthName,
      categoryId,
      categoryText,
      subcategory,
      formattedPrice
    ]);
  });

  const csvContent = rows
    .map(row =>
      row
        .map(value => `"${String(value).replace(/"/g, '""')}"`)
        .join(";")
    )
    .join("\r\n");

  // UTF-8 BOM για να διαβάζονται σωστά τα ελληνικά στο Excel
  const bom = "\uFEFF";

  const blob = new Blob(
    [bom + csvContent],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = "expenses.csv";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  URL.revokeObjectURL(url);
};

 // Αλλάζει τις υποκατηγορίες όταν αλλάζει η βασική κατηγορία
categoryEl.addEventListener("change", updateSubcategoryOptions);

// Αρχική φόρτωση υποκατηγοριών
updateSubcategoryOptions();

// Αρχική φόρτωση καταχωρήσεων
load();

</script>

</body>
</html>
